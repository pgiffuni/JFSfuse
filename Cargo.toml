[package]
name = "jfsfuse"
version = "0.1.0"
edition = "2024"
description = "JFS for FUSE on Rust"
license = "MIT OR GPL-2.0-or-later"

[features]
default = ["std", "writable"]
std = []
# Enable writable (journaled) mount support. Enabled by default.
# Use `--no-default-features --features std` for read-only builds.
writable = []

[dependencies]
byteorder = "1.5"
bitflags = "2.6"
lru = "0.16"
log = "0.4"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4"] }
fuse3 = { version = "0.7", optional = true }

[[bin]]
name = "jfsfuse-mount"
path = "src/bin/mount.rs"

[[bin]]
name = "jfsck"
path = "src/bin/jfsck.rs"

[[bin]]
name = "newjfs"
path = "src/bin/newjfs.rs"

[dev-dependencies]
byteorder = "1.5"
